# Release-сборка Windows. Exe самодостаточный: картинки и звуки вшиты в бинарник.
# После пуша в main файл появляется в списке релизов: v<версия из Cargo.toml>.
# Повторный пуш той же версии заменяет exe в том же релизе.

name: Сборка exe

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Код
        uses: actions/checkout@v4

      # На машине GitHub стоит Visual Studio, её линкер и собирает exe.
      # GNU-тулчейн rustup там берёт чужой gcc из Git for Windows и падает на линковке.
      # Локальная сборка без Visual Studio остаётся на GNU.
      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш
        uses: Swatinem/rust-cache@v2

      - name: Сборка
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log

      - name: Лог сборки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Имя по версии
        id: ver
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp target/release/battle-chess.exe "battle-chess-${version}-windows.exe"

      - name: Exe
        uses: actions/upload-artifact@v4
        with:
          name: battle-chess-${{ steps.ver.outputs.version }}-windows
          path: battle-chess-*-windows.exe
          if-no-files-found: error
          retention-days: 90

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Боевые шахматы ${{ steps.ver.outputs.version }}
          body: Файл для Windows — battle-chess-${{ steps.ver.outputs.version }}-windows.exe
          files: battle-chess-${{ steps.ver.outputs.version }}-windows.exe
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
